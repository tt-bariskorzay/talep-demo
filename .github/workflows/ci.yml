name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
  packages: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements-dev.txt
      - run: cd backend && pytest -v

  imaj:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        parca: [backend, frontend]
    env:
      IMAJ: ghcr.io/tt-bariskorzay/talep-${{ matrix.parca }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.parca }}
          push: true
          tags: ${{ env.IMAJ }}:${{ github.run_number }}

  test-kurulum:
    needs: imaj
    runs-on: [self-hosted, demo]
    environment: test
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: docker compose --env-file deploy/test.env up -d
        env:
          SURUM: ${{ github.run_number }}

  prod-kurulum:
    needs: test-kurulum
    runs-on: [self-hosted, demo]
    environment: prod
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: docker compose --env-file deploy/prod.env up -d
        env:
          SURUM: ${{ github.run_number }}
