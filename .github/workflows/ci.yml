name: CI

# Pull request'te yalnızca testler çalışır.
# main'e kod gelince: test -> imaj -> test ortamı -> (onay) -> prod.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: pytest -v
        working-directory: backend

  imaj:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        parca: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/talep-${{ matrix.parca }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.parca }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.parca }}
          cache-to: type=gha,mode=max,scope=${{ matrix.parca }}

  test-kurulum:
    needs: imaj
    runs-on: [self-hosted, demo]
    environment:
      name: test
      url: http://localhost:8081
    env:
      SURUM: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: İmajları çek ve test ortamını güncelle
        shell: pwsh
        run: |
          $env:SURUM = $env:SURUM.Substring(0, 7)
          docker compose -p talep-test --env-file deploy/test.env pull backend frontend
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          docker compose -p talep-test --env-file deploy/test.env up -d --no-build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          docker compose -p talep-test --env-file deploy/test.env ps

  prod-kurulum:
    needs: test-kurulum
    runs-on: [self-hosted, demo]
    environment:
      name: prod
      url: http://localhost:8082
    env:
      SURUM: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Aynı imajları prod ortamına kur
        shell: pwsh
        run: |
          $env:SURUM = $env:SURUM.Substring(0, 7)
          docker compose -p talep-prod --env-file deploy/prod.env pull backend frontend
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          docker compose -p talep-prod --env-file deploy/prod.env up -d --no-build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          docker compose -p talep-prod --env-file deploy/prod.env ps
